# Production-ish stack for the demo VM: app + Postgres + Caddy (automatic
# HTTPS via Let's Encrypt against a sslip.io hostname, no DNS setup needed).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sync
      POSTGRES_PASSWORD: sync
      POSTGRES_DB: invoice_sync
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sync -d invoice_sync"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://sync:sync@db:5432/invoice_sync
      PORT: "3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Sits in front of /webhooks/* so the URL registered with Intuit never has to
  # change while deliveries are re-pointed at a laptop tunnel. Dependency-free,
  # so a stock node image with the source bind-mounted is the whole deployment:
  # editing deploy/webhook-switch + `restart webhook-switch` is the update path.
  webhook-switch:
    image: node:22-alpine
    command: node /srv/server.mjs
    env_file: .env
    environment:
      SWITCH_PORT: "8080"
      SWITCH_APP_URL: http://app:3000
      SWITCH_STATE_FILE: /data/switch-state.json
    volumes:
      - ./deploy/webhook-switch:/srv:ro
      - switch_state:/data
    depends_on:
      - app
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST, e.g. 137-184-10-20.sslip.io}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - webhook-switch
    restart: unless-stopped

volumes:
  pgdata_prod:
  caddy_data:
  caddy_config:
  switch_state:
